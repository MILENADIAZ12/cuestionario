<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuestionario IP y Routers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Redes · Evaluación final</p>
    <h1>Cuestionario: Direccionamiento IP y Routers</h1>
    <p>12 preguntas basadas en situaciones reales. Al escoger una opción verás al instante si es correcta y por qué cada opción es correcta o incorrecta. Cada respuesta se bloquea al elegirla.</p>
  </header>

  <div class="bar" role="status" aria-live="polite">
    <div class="track"><div class="fill" id="fill"></div></div>
    <span class="stat">Respondidas <b id="answered">0</b>/12 · Correctas <b id="correct">0</b></span>
    <button class="btn ghost" id="reset" type="button">Reiniciar</button>
  </div>

  <div class="list" id="list"></div>

  <section class="result" id="result" hidden>
    <h2 id="rtitle"></h2>
    <p id="rtext"></p>
  </section>
</div>
<script src="script.js"></script>
</body>
</html>
